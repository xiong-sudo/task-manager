<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能任务管理</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">智能任务管理</h1>
      <p class="app__subtitle">把事情写下来，剩下的交给优先级</p>
    </header>

    <!-- 添加任务 -->
    <form class="composer" id="taskForm" autocomplete="off">
      <input
        id="titleInput"
        class="composer__input"
        type="text"
        maxlength="200"
        placeholder="需要做什么？例如：整理本周项目周报"
        aria-label="任务标题"
      />
      <select id="prioritySelect" class="composer__select" aria-label="优先级">
        <option value="high">高</option>
        <option value="medium" selected>中</option>
        <option value="low">低</option>
      </select>
      <button type="submit" class="composer__btn" id="addBtn">添加任务</button>
    </form>

    <!-- 筛选栏 -->
    <nav class="filters" id="filters" aria-label="按优先级筛选">
      <button class="filters__item is-active" data-filter="all">全部 <span class="filters__count" data-count="all">0</span></button>
      <button class="filters__item" data-filter="high">高 <span class="filters__count" data-count="high">0</span></button>
      <button class="filters__item" data-filter="medium">中 <span class="filters__count" data-count="medium">0</span></button>
      <button class="filters__item" data-filter="low">低 <span class="filters__count" data-count="low">0</span></button>
    </nav>

    <!-- 任务列表 -->
    <section class="list-wrap">
      <ul class="task-list" id="taskList"></ul>
      <div class="empty" id="emptyState" hidden>
        <div class="empty__icon">✓</div>
        <p class="empty__text" id="emptyText">还没有任务，从上面添加第一条吧</p>
      </div>
      <div class="loading" id="loadingState">正在加载任务…</div>
      <div class="banner" id="errorBanner" hidden></div>
    </section>

    <footer class="app__footer">
      数据实时保存在 Supabase 云端 · 本地运行于 Node.js
    </footer>
  </main>

  <script src="./app.js"></script>
</body>
</html>
